[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portpilot-cli"
version = "0.1.0"
description = "Find and free busy ports, including Docker containers, from one terminal screen."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hemashree V I", email = "shreejith2005@gmail.com" }]
keywords = ["port", "network", "docker", "cli", "tui", "devtools", "address-already-in-use"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Topic :: Utilities",
]
dependencies = ["psutil>=5.9", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
portpilot = "portpilot.__main__:main"

[project.urls]
Homepage = "https://github.com/HemashreeVI/portpilot"
Issues = "https://github.com/HemashreeVI/portpilot/issues"

[tool.setuptools]
packages = ["portpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
